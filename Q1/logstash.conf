# ─── Logstash Pipeline Configuration ─────────────────────────────────────────
# Reads JSON application logs, parses and enriches them, outputs to Elasticsearch

input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "app-log"
    tags => ["application", "nodejs"]
  }
}

filter {
  # Parse JSON log content
  if [message] {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  # Add environment metadata
  mutate {
    add_field => {
      "environment" => "development"
      "hostname" => "%{[host][name]}"
      "pipeline" => "devops-lab-logstash"
      "app_name" => "devops-lab-app"
    }
  }

  # Parse timestamp from the log entry
  if [timestamp] {
    date {
      match => ["timestamp", "YYYY-MM-DD HH:mm:ss", "ISO8601"]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  # Categorize log levels
  if [level] == "error" or [level] == "fatal" {
    mutate {
      add_tag => ["error"]
      add_field => { "severity" => "high" }
    }
  } else if [level] == "warn" {
    mutate {
      add_tag => ["warning"]
      add_field => { "severity" => "medium" }
    }
  } else {
    mutate {
      add_field => { "severity" => "low" }
    }
  }

  # Extract HTTP method and status from morgan-style logs
  if [component] == "http" {
    grok {
      match => {
        "message" => "%{WORD:http_method} %{URIPATHPARAM:http_path} %{NUMBER:http_status:int} %{NUMBER:http_bytes:int}? ?- %{NUMBER:http_response_time:float} ms"
      }
      tag_on_failure => ["_grok_http_parse_failure"]
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["[host]", "[log]", "[event]"]
  }

  # Add a unique document ID
  uuid {
    target => "log_id"
  }
}

output {
  # Primary output: Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
    template_name => "app-logs"
    template_overwrite => true
  }

  # Secondary output: stdout for debugging
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }
}
